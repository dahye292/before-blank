<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>생각 먼저</title>
  <!-- 글꼴: Pretendard (orioncactus/pretendard, OFL) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <!-- 그림자·둥글기·움직임 값: Open Props (argyleink/open-props, MIT) -->
  <link rel="stylesheet" href="https://unpkg.com/open-props@1.7.4/open-props.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main id="app" class="app"></main>

  <!--
    마스코트: 연필을 들고 고민하는 오리너구리 (static/mascot.png, 배경 투명).
    다른 그림으로 바꾸려면 아래 template 안의 img만 교체하면 됩니다.
  -->
  <template id="mascot-template">
    <img src="/static/mascot.png" alt="연필을 들고 고민하는 오리너구리 마스코트" width="140" height="136">
  </template>

  <script src="/static/app.js"></script>

</html>
