<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비포블랭크 Before Blank</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <!-- 화면이 깜빡이지 않도록, 그리기 전에 고른 테마부터 적용 (보안 정책상 인라인 스크립트 대신 파일로) -->
  <script src="/static/theme.js"></script>
  <!-- 글꼴: IBM Plex Sans KR · IBM Plex Mono (Google Fonts, SIL OFL 1.1) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+KR:wght@500;700&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main id="app" class="app"></main>

  <!--
    마스코트: 연필을 들고 고민하는 오리너구리 (static/mascot.png, 배경 투명).
    다른 그림으로 바꾸려면 아래 template 안의 img만 교체하면 됩니다.
  -->
  <template id="mascot-template">
    <img src="/static/mascot.png" alt="비포블랭크 마스코트, 연필을 들고 고민하는 오리너구리" width="92" height="89">
  </template>

  <script src="/static/app.js"></script>
</body>
</html>
